<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心小跳塔羅 | 照見靈魂的真實</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        window.addEventListener('load', function() {
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            brand: { light: '#fda4af', DEFAULT: '#fb7185', dark: '#e11d48', deep: '#881337' },
                            mystic: { bg: '#0a060d', surface: '#1a1221', border: 'rgba(251, 113, 133, 0.2)' }
                        },
                        fontFamily: { serif: ['Noto Serif TC', 'serif'], sans: ['Noto Sans TC', 'sans-serif'] }
                    }
                }
            }
        });
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@300;400;700&display=swap');
        :root { --brand: #fb7185; }
        body { background-color: #050206; color: #f3f4f6; overflow-x: hidden; scroll-behavior: smooth; font-family: 'Noto Sans TC', sans-serif; }
        
        .glass { background: rgba(26, 18, 33, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(251, 113, 133, 0.15); }
        .gold-glow { text-shadow: 0 0 15px rgba(251, 113, 133, 0.6); color: var(--brand); }
        
        .btn-mystic {
            background: linear-gradient(135deg, #fda4af 0%, #fb7185 100%);
            color: #1a1221; font-weight: 800; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 9999px; box-shadow: 0 4px 20px rgba(251, 113, 133, 0.3);
            display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-mystic:hover:not(:disabled) { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 30px rgba(251, 113, 133, 0.5); }
        .btn-mystic:disabled { background: #333; color: #666; cursor: not-allowed; box-shadow: none; }

        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1a1221 0%, #050206 100%); z-index: -1; }
        .star-layer { position: absolute; inset: -50%; background-image: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity: 0.2; animation: starWarp 120s linear infinite; }
        @keyframes starWarp { from { transform: rotate(0deg); } to { transform: rotate(10deg); background-position: -4000px 4000px; } }

        @keyframes heartPulse { 0%, 30%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(251, 113, 133, 0.4)); } 15%, 45% { transform: scale(1.15); filter: drop-shadow(0 0 25px rgba(251, 113, 133, 0.9)); } }
        .pulse-heart { animation: heartPulse 2s infinite ease-in-out; color: var(--brand); display: inline-block; }

        .tarot-card-box { perspective: 1500px; width: 100%; max-width: 220px; }
        .tarot-card { width: 100%; padding-top: 175%; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .tarot-card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 16px; border: 2px solid rgba(251, 113, 133, 0.3); overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .card-back { background: linear-gradient(135deg, #1a1221, #2d1b33); background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); }
        .card-front { transform: rotateY(180deg); background: #fff; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .reversed { transform: rotate(180deg) !important; }

        .fan-area { position: relative; height: 380px; user-select: none; touch-action: none; overflow: visible; margin-top: 40px; }
        .fan-item { position: absolute; left: calc(50% - 40px); width: 80px; height: 135px; transform-origin: center 480px; cursor: pointer; transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: var(--idx); }
        .fan-item:hover { z-index: 1000 !important; transform: rotate(var(--rot)) translateY(-50px) scale(1.2) !important; border-color: var(--brand); box-shadow: 0 15px 40px rgba(251, 113, 133, 0.7); }
        
        .tag { background: rgba(251, 113, 133, 0.1); color: #fda4af; padding: 4px 12px; border-radius: 99px; font-size: 11px; font-weight: 700; border: 1px solid rgba(251, 113, 133, 0.2); }
        .energy-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 10px var(--brand); transition: all 0.5s; }
        .energy-dot.empty { background: #333; box-shadow: none; opacity: 0.5; }
    </style>
</head>
<body class="antialiased">
    <!-- Toast 通知 -->
    <div id="toast-container" class="fixed bottom-10 left-1/2 -translate-x-1/2 z-[1000] pointer-events-none">
        <div id="toast" class="opacity-0 translate-y-10 transition-all duration-500 bg-brand text-mystic-bg font-black px-8 py-4 rounded-full shadow-2xl text-center min-w-[280px]"></div>
    </div>

    <div class="stars-container"><div class="star-layer"></div></div>
    
    <!-- 導覽列 -->
    <nav class="fixed top-0 w-full z-[60] glass border-b border-white/5 py-4 px-6 transition-all" id="nav">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">
                <i class="fa-solid fa-heart-pulse pulse-heart text-2xl"></i>
                <span class="serif font-black text-xl gold-glow tracking-tighter">心小跳塔羅</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="hidden sm:flex items-center gap-2 bg-white/5 px-4 py-2 rounded-full border border-white/10">
                    <span class="text-[10px] font-black text-brand tracking-widest uppercase mr-2">每日限額</span>
                    <div id="energy-container" class="flex gap-2">
                        <div class="energy-dot"></div>
                        <div class="energy-dot"></div>
                        <div class="energy-dot"></div>
                    </div>
                </div>
                <div class="hidden md:flex gap-8 text-sm font-bold items-center uppercase tracking-widest">
                    <a href="#app" class="hover:text-brand transition" onclick="window.switchTab('reading')">開始占卜</a>
                    <a href="javascript:void(0)" onclick="window.switchTab('history')" class="hover:text-brand transition">能量軌跡</a>
                    <a href="https://www.instagram.com/dokidokiboomboom.tarot/" target="_blank" class="btn-mystic px-5 py-2 text-[10px]">預約諮商</a>
                </div>
                <button class="md:hidden text-2xl" onclick="window.showToast('點擊開始占卜進入靈魂旅程')"><i class="fa-solid fa-bars-staggered"></i></button>
            </div>
        </div>
    </nav>

    <!-- 英雄區 -->
    <header class="min-h-screen flex flex-col items-center justify-center pt-24 px-4 text-center">
        <div class="max-w-4xl space-y-10">
            <div class="relative inline-block">
                <i class="fa-solid fa-heart-pulse text-8xl md:text-[10rem] pulse-heart gold-glow"></i>
                <div class="absolute inset-0 bg-brand/20 blur-[100px] rounded-full -z-10 animate-pulse scale-150"></div>
            </div>
            <div class="space-y-4">
                <div class="inline-block px-4 py-1 rounded-full border border-brand/30 bg-brand/5 text-brand text-[10px] font-black tracking-[0.3em] animate-pulse uppercase">Doki Doki Soul Healing</div>
                <h1 class="text-5xl md:text-8xl serif font-black leading-tight tracking-tighter">看見潛意識中<br><span class="gold-glow">真正的卡點</span></h1>
                <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto font-medium leading-relaxed">
                    透過原型照見，開啟妳的轉化旅程。<br>
                    這不是預測命運，而是與妳的靈魂重新連線。
                </p>
            </div>
            <div class="flex flex-col items-center gap-6">
                <a href="#app" onclick="window.switchTab('reading')" class="btn-mystic px-20 py-5 text-xl shadow-lg tracking-widest group">
                    開啟靈魂解析 <i class="fa-solid fa-arrow-right ml-3 transition-transform group-hover:translate-x-2"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- 核心應用區 -->
    <main id="app" class="py-20 px-4 max-w-6xl mx-auto scroll-mt-24">
        <div class="glass rounded-[3rem] overflow-hidden shadow-2xl border border-white/10">
            <div class="flex border-b border-white/5 bg-black/40 font-black text-xs md:text-sm tracking-widest uppercase">
                <button onclick="window.switchTab('daily')" id="tab-daily" class="flex-1 py-6 transition-all border-r border-white/5">每日一抽</button>
                <button onclick="window.switchTab('reading')" id="tab-reading" class="flex-1 py-6 transition-all border-r border-white/5">深度解惑</button>
                <button onclick="window.switchTab('history')" id="tab-history" class="flex-1 py-6 transition-all">能量軌跡</button>
            </div>
            
            <div class="p-8 md:p-16 min-h-[650px] relative">
                <!-- 每日一抽 -->
                <div id="panel-daily" class="tab-panel flex flex-col items-center text-center animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <h2 class="text-4xl serif font-black mb-4">今日能量照見</h2>
                    <p class="text-gray-400 mb-12 font-medium max-w-md">深呼吸三次，當妳感覺心跳與宇宙對齊時，點擊牌面領取啟示。</p>
                    <div class="tarot-card-box mb-12">
                        <div class="tarot-card" id="daily-card-element" onclick="window.drawDaily()">
                            <div class="card-face card-back"><div class="text-brand/20 text-4xl"><i class="fa-solid fa-moon-stars"></i></div></div>
                            <div class="card-face card-front" id="daily-card-front"></div>
                        </div>
                    </div>
                    <button id="btn-draw-daily" onclick="window.drawDaily()" class="btn-mystic px-16 py-4 font-black tracking-widest">領取靈魂啟示</button>
                </div>

                <!-- 深度問事設定 -->
                <div id="panel-reading" class="tab-panel hidden animate-in fade-in duration-500">
                    <div id="reading-setup" class="max-w-4xl mx-auto space-y-12">
                        <div class="grid md:grid-cols-2 gap-12">
                            <div class="space-y-8">
                                <div><label class="block text-[10px] font-black text-brand mb-4 tracking-[0.3em] uppercase">STEP 1. 能量領域</label>
                                    <div class="grid grid-cols-2 gap-3">
                                        <button class="cat-btn px-4 py-4 rounded-2xl border border-white/10 text-sm font-bold transition hover:bg-brand/10 hover:border-brand/40" onclick="window.setCategory('love', this)">親密關係</button>
                                        <button class="cat-btn px-4 py-4 rounded-2xl border border-white/10 text-sm font-bold transition hover:bg-brand/10 hover:border-brand/40" onclick="window.setCategory('career', this)">事業顯化</button>
                                    </div>
                                </div>
                                <div><label class="block text-[10px] font-black text-brand mb-4 tracking-[0.3em] uppercase">STEP 2. 提問內容</label>
                                    <textarea id="q-custom" rows="3" placeholder="描述妳目前的困惑..." class="w-full bg-mystic-surface border border-white/10 rounded-2xl p-4 text-sm focus:border-brand/50 outline-none transition font-bold resize-none"></textarea>
                                </div>
                            </div>
                            <div class="space-y-8">
                                <div><label class="block text-[10px] font-black text-brand mb-4 tracking-[0.3em] uppercase">STEP 3. 牌陣選擇</label>
                                    <div class="grid grid-cols-3 gap-3">
                                        <button class="spread-btn px-3 py-5 rounded-2xl border border-white/10 text-xs font-black transition" onclick="window.setSpread(1, this)">核心(1)</button>
                                        <button class="spread-btn px-3 py-5 rounded-2xl border border-white/10 text-xs font-black transition" onclick="window.setSpread(3, this)">演化(3)</button>
                                        <button class="spread-btn px-3 py-5 rounded-2xl border border-white/10 text-xs font-black transition" onclick="window.setSpread(6, this)">全景(6)</button>
                                    </div>
                                </div>
                                <div><label class="block text-[10px] font-black text-brand mb-4 tracking-[0.3em] uppercase">STEP 4. 連結方式</label>
                                    <div class="flex gap-3"><button class="method-btn flex-1 py-5 rounded-2xl border border-white/10 text-sm font-black transition" onclick="window.setMethod('auto', this)">直覺洗牌</button><button class="method-btn flex-1 py-5 rounded-2xl border border-white/10 text-sm font-black transition" onclick="window.setMethod('manual', this)">親自選牌</button></div>
                                </div>
                            </div>
                        </div>
                        <div class="pt-8 text-center"><button id="btn-start-reading" onclick="window.startReading()" class="btn-mystic px-20 py-5 text-xl font-black tracking-[0.2em]">連結能量場</button></div>
                    </div>

                    <!-- 手動選牌區 -->
                    <div id="reading-manual" class="hidden flex flex-col items-center animate-in fade-in zoom-in-95 duration-700">
                        <div id="deck-fan" class="fan-area w-full max-w-5xl"></div>
                        <div class="w-full mt-8 bg-white/5 border border-white/10 rounded-[2rem] p-8">
                            <div class="flex flex-wrap justify-center gap-4 min-h-[140px]" id="picked-slots"></div>
                        </div>
                        <button id="btn-manual-reveal" class="btn-mystic px-16 py-5 mt-10 hidden animate-pulse font-black" onclick="window.revealManual()">揭曉神諭</button>
                    </div>
                </div>

                <!-- 載入中 -->
                <div id="loading" class="hidden absolute inset-0 glass z-50 flex flex-col items-center justify-center text-center p-6">
                    <div class="relative w-32 h-32 mb-8 mx-auto">
                        <div class="absolute inset-0 border-4 border-brand/10 rounded-full"></div>
                        <div class="absolute inset-0 border-4 border-t-brand rounded-full animate-spin"></div>
                    </div>
                    <p class="text-brand font-black tracking-[0.5em] text-2xl uppercase" id="loading-msg">正在連結能量...</p>
                </div>

                <!-- 結果區 -->
                <div id="result" class="hidden space-y-16 animate-in fade-in duration-1000">
                    <div class="flex justify-between items-center mb-4 border-b border-white/5 pb-6">
                        <button onclick="window.backToSetup()" class="text-xs font-black text-gray-400 hover:text-brand transition flex items-center gap-2 bg-white/5 px-6 py-3 rounded-full"><i class="fa-solid fa-arrow-left"></i> 重新提問</button>
                        <button onclick="window.toggleFavoriteCurrent()" id="fav-btn" class="text-3xl text-gray-700 hover:text-yellow-400 transition"><i class="fa-regular fa-star"></i></button>
                    </div>
                    <div class="text-center space-y-6">
                        <h2 class="text-5xl md:text-7xl serif font-black gold-glow" id="res-title"></h2>
                        <p id="res-q" class="text-gray-400 italic text-xl font-bold"></p>
                    </div>
                    <div class="flex flex-wrap justify-center gap-10 py-10" id="res-cards"></div>
                    <div id="res-content" class="max-w-4xl mx-auto space-y-12 leading-relaxed text-gray-200 font-bold"></div>
                </div>

                <!-- 歷史紀錄 -->
                <div id="panel-history" class="tab-panel hidden"><div id="history-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div></div>
            </div>
        </div>
    </main>

    <!-- 限制彈窗 -->
    <div id="modal-limit" class="fixed inset-0 z-[200] hidden items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/98 backdrop-blur-xl"></div>
        <div class="relative w-full max-w-md text-center space-y-10 animate-in zoom-in duration-500">
            <i class="fa-solid fa-heart-pulse text-7xl text-brand"></i>
            <h3 class="text-3xl serif font-black text-white">今日連結已達上限</h3>
            <p class="text-gray-400 px-4 leading-relaxed">過度的提問會讓能量混亂。今天占卜就到這裡，請稍作休息或尋求深度諮商。</p>
            <a href="https://www.instagram.com/dokidokiboomboom.tarot/" target="_blank" class="btn-mystic w-full py-5 font-black text-lg">預約 1 對 1 深度諮商</a>
            <button class="text-xs text-gray-400 underline mt-4" onclick="window.closeModal('modal-limit')">我知道了</button>
        </div>
    </div>

    <!-- 腳本邏輯 -->
    <script>
        /**
         * --- 重要：部署說明 ---
         * 1. 如果在 GitHub 部署，請在下方 apiKey 填入您的真實 Google AI Studio 金鑰。
         * 2. 如果在 Canvas 預覽環境，請保持 apiKey 為空字串。
         */
        const apiKey = "AIzaSyAMvYyvoiMq8zDI--_Vfwh7_dMCg4Oy1s4"; 

        const IMAGE_BASE = "https://www.sacred-texts.com/tarot/pkt/img/";
        
        window.state = { 
            tab: 'daily', 
            spread: 1, 
            energy: 3, 
            history: [], 
            method: 'auto',
            selectedCards: [],
            isDrawing: false
        };

        const universeMessages = [
            "妳生命中所發生的一切，都是妳吸引來的。妳的思想擁有改變現實的力量。", 
            "感恩是妳能對應宇宙最高頻率的最短路徑。", 
            "當妳感到快樂，妳就正在顯化更多讓妳快樂的事物。"
        ];

        const tarotData = (() => {
            const majors = ["愚者","魔術師","女祭司","女皇","皇帝","教皇","戀人","戰車","力量","隱者","命運之輪","正義","倒吊人","死神","節制","惡魔","高塔","星星","月亮","太陽","審判","世界"];
            const suits = [{n:'權杖', p:'wa'}, {n:'聖杯', p:'cu'}, {n:'寶劍', p:'sw'}, {n:'錢幣', p:'pe'}];
            const ranks = {ac:'王牌','02':'二','03':'三','04':'四','05':'五','06':'六','07':'七','08':'八','09':'九','10':'十',pa:'侍者',kn:'騎士',qu:'皇后',ki:'國王'};
            let deck = [];
            majors.forEach((name, i) => deck.push({ id: `ar${String(i).padStart(2,'0')}`, name: `${name}(${i})` }));
            suits.forEach(s => Object.entries(ranks).forEach(([k, v]) => deck.push({ id: s.p + k, name: `${s.n}${v}` })));
            return deck;
        })();

        // 優化後的 API 呼叫函式
        async function fetchAI(prompt, retryCount = 0) {
            // 使用環境要求的 gemini-2.5-flash-preview-09-2025 模型
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: "妳是一位專業且溫柔的心靈諮商師。請嚴格以繁體中文 JSON 回傳結果。格式要求：{interpretations:[{keywords:[],meaning:'',advice:''}], summary:'', soulMantra:'', dailyActions:[]}" }] },
                generationConfig: { responseMimeType: "application/json" }
            };

            try {
                const response = await fetch(url, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(payload) 
                });
                
                if (!response.ok) {
                    const errText = await response.text();
                    console.error("API 錯誤響應:", errText);
                    throw new Error(`API Request Failed with status ${response.status}`);
                }
                
                const data = await response.json();
                const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!rawText) throw new Error("API 回傳內容為空");
                
                return JSON.parse(rawText);
            } catch (err) {
                console.error("fetchAI 發生異常:", err);
                if (retryCount < 4) {
                    const delay = Math.pow(2, retryCount) * 1000;
                    await new Promise(r => setTimeout(r, delay));
                    return fetchAI(prompt, retryCount + 1);
                }
                throw err;
            }
        }

        window.updateEnergyUI = function() {
            const dots = document.querySelectorAll('.energy-dot');
            dots.forEach((dot, i) => i < window.state.energy ? dot.classList.remove('empty') : dot.classList.add('empty'));
            
            const startBtn = document.getElementById('btn-start-reading');
            const dailyBtn = document.getElementById('btn-draw-daily');
            
            if (window.state.energy <= 0) {
                if(startBtn) startBtn.innerText = "能量已達上限，請預約諮商";
                if(dailyBtn) dailyBtn.innerText = "能量已達上限";
            }
        };

        window.consumeEnergy = function() {
            if (window.state.energy <= 0) {
                window.openModal('modal-limit');
                return false;
            }
            window.state.energy--;
            window.updateEnergyUI();
            return true;
        };

        window.drawDaily = async function() {
            if (window.state.isDrawing) return;
            if (!window.consumeEnergy()) return;

            window.state.isDrawing = true;
            showLoading();
            
            const card = { 
                ...tarotData[Math.floor(Math.random() * tarotData.length)], 
                isRev: Math.random() > 0.5 
            };
            
            try {
                const ai = await fetchAI(`每日一抽：${card.name} (${card.isRev?'逆位':'正位'})。請針對今日能量給予深層靈魂解析。`);
                hideLoading();
                
                const cardEl = document.getElementById('daily-card-element');
                const cardFront = document.getElementById('daily-card-front');
                cardEl.classList.remove('flipped');
                cardFront.innerHTML = `<img src="${IMAGE_BASE}${card.id}.jpg" class="card-img ${card.isRev?'reversed':''}">`;
                
                setTimeout(() => {
                    cardEl.classList.add('flipped');
                    setTimeout(() => displayResult("今日靈魂照見", "今日專屬能量", [card], ["核心能量"], ai), 1000);
                }, 100);
            } catch(e) {
                console.error(e);
                hideLoading();
                window.showToast("目前無法連結宇宙能量，請檢查金鑰或網路。");
            } finally {
                window.state.isDrawing = false;
            }
        };

        window.startReading = async function() {
            const q = document.getElementById('q-custom').value.trim();
            if(!q) return window.showToast("請輸入妳想探索的問題。");
            if (window.state.energy <= 0) return window.openModal('modal-limit');
            
            window.state.question = q;

            if(window.state.method === 'auto') {
                if (!window.consumeEnergy()) return;
                showLoading();
                const cards = [], shuffled = [...tarotData].sort(() => Math.random() - 0.5);
                for(let i=0; i<window.state.spread; i++) {
                    cards.push({ ...shuffled[i], isRev: Math.random() > 0.5 });
                }
                const pos = window.getPositions(window.state.spread);
                try {
                    const ai = await fetchAI(`問題：「${q}」，牌陣：${cards.map((c,i)=>`[${pos[i]}] ${c.name}(${c.isRev?'逆位':'正位'})`).join('、')}。請深度解析。`);
                    displayResult("靈魂深度解析", q, cards, pos, ai);
                } catch(e) {
                    console.error(e);
                    hideLoading();
                    window.showToast("能量場發生干擾，請稍後再試。");
                }
            } else {
                initManualDraw();
            }
        };

        function initManualDraw() {
            document.getElementById('reading-setup').classList.add('hidden');
            document.getElementById('reading-manual').classList.remove('hidden');
            window.state.selectedCards = [];
            
            const fan = document.getElementById('deck-fan');
            const slots = document.getElementById('picked-slots');
            fan.innerHTML = ''; 
            slots.innerHTML = '';
            
            for(let i=0; i<window.state.spread; i++) {
                slots.innerHTML += `<div class="w-20 h-32 border-2 border-dashed border-white/10 rounded-xl flex items-center justify-center text-[10px] text-gray-600 font-black">#${i+1}</div>`;
            }

            const currentDeck = [...tarotData].sort(() => Math.random() - 0.5);
            for(let i=0; i<50; i++) {
                const rotate = -75 + (i * (150 / 49));
                const item = document.createElement('div');
                item.className = 'fan-item card-face card-back border border-brand/20 shadow-lg';
                item.style.setProperty('--rot', `${rotate}deg`);
                item.style.setProperty('--idx', i);
                item.style.transform = `rotate(${rotate}deg)`;
                
                item.onclick = () => {
                    if (window.state.selectedCards.length >= window.state.spread || item.dataset.picked === "true") return;
                    item.dataset.picked = "true";
                    item.style.opacity = '0';
                    const c = { ...currentDeck[i], isRev: Math.random() > 0.5 };
                    window.state.selectedCards.push(c);
                    slots.children[window.state.selectedCards.length-1].innerHTML = `<div class="w-full h-full rounded-xl card-back animate-pulse"></div>`;
                    if (window.state.selectedCards.length === window.state.spread) {
                        document.getElementById('btn-manual-reveal').classList.remove('hidden');
                    }
                };
                fan.appendChild(item);
            }
        }

        window.revealManual = async function() {
            if (!window.consumeEnergy()) return;
            showLoading();
            const pos = window.getPositions(window.state.spread);
            try {
                const ai = await fetchAI(`提問：「${window.state.question}」，牌面如下：${window.state.selectedCards.map((c,i)=>`[${pos[i]}] ${c.name}(${c.isRev?'逆位':'正位'})`).join('、')}。`);
                displayResult("個人靈魂透視", window.state.question, window.state.selectedCards, pos, ai);
            } catch(e) {
                console.error(e);
                hideLoading();
                window.showToast("解析失敗。");
            }
        };

        function displayResult(title, q, cards, pos, ai) {
            hideLoading();
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
            document.getElementById('reading-manual').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
            
            document.getElementById('res-title').innerText = title;
            document.getElementById('res-q').innerText = q;
            
            const cardBox = document.getElementById('res-cards');
            cardBox.innerHTML = cards.map((c, i) => `
                <div class="text-center w-32 md:w-44 group">
                    <p class="text-[10px] font-black text-brand mb-2 uppercase tracking-widest">${pos[i]}</p>
                    <div class="relative pt-[175%] rounded-2xl overflow-hidden border border-white/10 shadow-2xl">
                        <img src="${IMAGE_BASE}${c.id}.jpg" class="absolute inset-0 w-full h-full card-img ${c.isRev?'reversed':''}">
                    </div>
                    <p class="mt-4 text-sm font-black text-white">${c.name} ${c.isRev?'(逆位)':'(正位)'}</p>
                </div>
            `).join('');

            const content = document.getElementById('res-content');
            content.innerHTML = (ai.interpretations || []).map((item, i) => `
                <div class="glass p-10 rounded-[2.5rem] space-y-8">
                    <h3 class="text-3xl serif font-black">【${pos[i]}】 ${cards[i].name}</h3>
                    <div class="flex gap-2 flex-wrap">${(item.keywords || []).map(k => `<span class="tag">#${k}</span>`).join('')}</div>
                    <div class="space-y-8 text-lg">
                        <div class="border-l-2 border-brand/20 pl-6"><h4 class="text-[10px] font-black text-brand mb-3 uppercase tracking-widest">能量照見</h4><p>${item.meaning}</p></div>
                        <div class="bg-brand/5 p-8 rounded-3xl border border-brand/10"><h4 class="text-[10px] font-black text-brand mb-3 uppercase tracking-widest">建議指引</h4><p class="font-bold text-white">${item.advice}</p></div>
                    </div>
                </div>
            `).join('');

            content.innerHTML += `
                <div class="text-center pt-20 space-y-10 pb-10">
                    <h3 class="text-4xl serif font-black gold-glow">能量整合結論</h3>
                    <p class="text-gray-300 text-xl font-medium leading-relaxed max-w-2xl mx-auto">${ai.summary}</p>
                    <div class="inline-block bg-white/5 p-12 rounded-[3.5rem] border border-white/10 italic text-3xl font-black text-brand">「${ai.soulMantra}」</div>
                </div>
            `;
            
            window.scrollTo({ top: document.getElementById('app').offsetTop, behavior: 'smooth' });
        }

        window.showToast = function(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.replace('opacity-0', 'opacity-100');
            t.classList.replace('translate-y-10', 'translate-y-0');
            setTimeout(() => {
                t.classList.replace('opacity-100', 'opacity-0');
                t.classList.replace('translate-y-0', 'translate-y-10');
            }, 3000);
        };

        window.switchTab = function(t) {
            window.state.tab = t;
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
            document.getElementById(`panel-${t}`).classList.remove('hidden');
            document.getElementById('result').classList.add('hidden');
            if (t === 'reading') {
                document.getElementById('reading-setup').classList.remove('hidden');
                document.getElementById('reading-manual').classList.add('hidden');
            }
        };

        window.getPositions = n => n === 1 ? ["核心解方"] : (n === 3 ? ["過去之因", "現在卡點", "未來顯化"] : ["現狀", "阻礙", "潛意識", "基礎", "趨勢", "指引"]);
        function showLoading() { document.getElementById('loading').classList.remove('hidden'); }
        function hideLoading() { document.getElementById('loading').classList.add('hidden'); }
        window.openModal = id => document.getElementById(id).classList.replace('hidden', 'flex');
        window.closeModal = id => document.getElementById(id).classList.replace('flex', 'hidden');
        window.backToSetup = () => { document.getElementById('result').classList.add('hidden'); window.switchTab('reading'); };
        
        window.setCategory = (c, b) => { 
            document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('bg-brand/10', 'border-brand')); 
            b.classList.add('bg-brand/10', 'border-brand'); 
        };
        window.setSpread = (n, b) => { 
            window.state.spread = n; 
            document.querySelectorAll('.spread-btn').forEach(x=>x.classList.remove('bg-brand/10', 'border-brand')); 
            b.classList.add('bg-brand/10', 'border-brand'); 
        };
        window.setMethod = (m, b) => { 
            window.state.method = m; 
            document.querySelectorAll('.method-btn').forEach(x=>x.classList.remove('bg-brand/10', 'border-brand')); 
            b.classList.add('bg-brand/10', 'border-brand'); 
        };

        document.addEventListener('DOMContentLoaded', () => { 
            window.updateEnergyUI(); 
            window.setCategory('love', document.querySelector('.cat-btn'));
            window.setSpread(1, document.querySelector('.spread-btn'));
            window.setMethod('auto', document.querySelector('.method-btn'));
        });
    </script>
</body>
</html>
